name: Home Assistant beta

# The integration reads private Home Assistant internals (Store, registries, MQTT
# debug data). Run the test suite against the newest pre-release every week, so a
# change there is noticed before the release reaches users.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install newest Home Assistant pre-release and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --pre homeassistant
          python -m pip install ".[test]"
          python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
      - name: Card logic tests (plain Node, no npm packages)
        run: |
          node tests/card/card_logic.test.mjs
          node tests/card/registry.test.mjs
      - name: Test
        run: pytest -q
